[package]
name = "app"
description = "Newjen's macOS window: GPUI and GPUI Kit, rendering newjen-core's state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# `cargo run -p app` builds and starts the `newjen` binary.
[[bin]]
name = "newjen"
path = "src/main.rs"

[dependencies]
alacritty_terminal.workspace = true
portable-pty.workspace = true
libc.workspace = true
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSDockTile", "NSResponder", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSObject", "NSString"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = "=0.6.2"
anyhow.workspace = true
async-channel.workspace = true
gpui.workspace = true
gpui-kit.workspace = true
gpui_platform.workspace = true
newjen-core.workspace = true
semver.workspace = true
serde_json.workspace = true
url = "=2.5.8"

[dev-dependencies]
tempfile.workspace = true
gpui = { workspace = true, features = ["test-support"] }
