[package]
name = "app"
description = "Newjen's macOS window: GPUI + Ely, rendering newjen-core's state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# `cargo run -p app` builds and starts the `newjen` binary.
[[bin]]
name = "newjen"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ely-gpui-component.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
newjen-core.workspace = true
serde_json.workspace = true
