# The Newjen Cargo workspace. Think of it like an npm/pnpm workspace: one lockfile,
# several crates (packages) that build together.
[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

# Settings every crate inherits with `x.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

# Every dependency is pinned to an exact version (`=x.y.z`) so builds are reproducible.
# Crates opt in with `name.workspace = true`. These versions match what GPUI and Ely already
# pull in, so the whole workspace shares one copy of each and builds offline.
[workspace.dependencies]
anyhow = "=1.0.104"
async-channel = "=2.5.0"
libc = "=0.2.191"
# SQLite with its C source compiled in (`bundled`), so no system library is needed.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
uuid = { version = "=1.29.0", features = ["v4"] }

# UI (crates/app only; `core` must never use these).
ely-gpui-component = "=0.1.1"
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit"] }
newjen-core = { path = "crates/core" }
# macOS's own API, for the one setting GPUI and Ely do not read themselves (Reduce Motion).
# GPUI already builds this crate, so it adds nothing new to the build.
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }
