# The Newjen Cargo workspace. Think of it like an npm/pnpm workspace: one lockfile,
# several crates (packages) that build together.
[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

# Settings every crate inherits with `x.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

# Every dependency is pinned to an exact version (`=x.y.z`) so builds are reproducible.
# Crates opt in with `name.workspace = true`. These versions match what GPUI Kit already
# pull in, so the whole workspace shares one copy of each and builds offline.
[workspace.dependencies]
alacritty_terminal = "=0.26.0"
portable-pty = "=0.9.0"
anyhow = "=1.0.104"
async-channel = "=2.5.0"
libc = "=0.2.191"
# SQLite with its C source compiled in (`bundled`), so no system library is needed.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
# Ed25519 signature checks for downloaded updates. Already in the lockfile through rustls.
ring = "=0.17.14"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# The version GPUI Kit's diff view already uses.
similar = "=2.7.0"
tempfile = "=3.27.0"
uuid = { version = "=1.29.0", features = ["v4"] }

# UI (crates/app only; `core` must never use these).
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit"] }
gpui-kit = { version = "=0.8.1", features = ["tree-sitter", "tree-sitter-bash", "tree-sitter-rust", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-python", "tree-sitter-toml"] }
newjen-core = { path = "crates/core" }
